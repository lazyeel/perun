[package]
name = "perun-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Loader core for the Perun native binary projection runtime: PE32+ (Win32) and Mach-O x86_64 (Darwin) images"

[dependencies]
libc = "0.2"

[features]
# Research instrument: mines every pinned rdtsc site to `0xCC` and records
# which ones the guest actually reaches. Off by default; main never sees it.
rdtsc-census = []
