[package]
name = "perun-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line runner, image inspector, and FairPlay SAP session driver for the Perun native binary projection runtime"

[[bin]]
name = "perun"
path = "src/main.rs"

# The same entry point installed under the ipatool name: argv[0] detection
# switches the CLI to the majd/ipatool persona (strict v2 grammar). A symlink
# `ln -s perun ipatool` works identically.
[[bin]]
name = "ipatool"
path = "src/main.rs"

[features]
rdtsc-census = ["perun-core/rdtsc-census"]

[dependencies]
perun-core = { workspace = true }
perun-shims = { workspace = true }
libc = "0.2"
bzip2-rs = "0.1.2"
memmap2 = "0.9.11"
# HTTP for the Store lane and the asset fetcher, replacing the external curl
# binary. `cookies` is what backs the shared mz_at0 session jar (ureq speaks the
# same netscape format curl wrote), `tls` is rustls + webpki-roots, so no OpenSSL.
# `cookie_store` is the same version ureq pins, so the Cookie the jar hands us
# is this type and its domain/path/expiry are readable for the jar file.
cookie_store = "0.22"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json", "cookies"] }
