[package]
name = "perun-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line runner, image inspector, and FairPlay SAP session driver for the Perun native binary projection runtime"

[[bin]]
name = "perun"
path = "src/main.rs"

# The same entry point installed under the ipatool name: argv[0] detection
# switches the CLI to the majd/ipatool persona (strict v2 grammar). A symlink
# `ln -s perun ipatool` works identically.
[[bin]]
name = "ipatool"
path = "src/main.rs"


# Memory benchmark for the IPA replicator (research only).
# It is the same module tree the CLI uses, so `replicate()` is exercised for
# real on a package already on disk, with no download in the measurement.
[[bin]]
name = "rep-bench"
path = "src/rep_bench.rs"
required-features = ["rep-bench"]

[features]
rep-bench = []

[dependencies]
perun-core = { workspace = true }
perun-shims = { workspace = true }
libc = "0.2"
bzip2-rs = "0.1.2"
# HTTP for the Store lane and the asset fetcher, replacing the external curl
# binary. `cookies` is deliberately NOT enabled: it pulls `cookie_store`, and
# through it `url` -> `idna` -> the whole ICU4X slice, 15 crates under the
# copyleft Unicode-3.0, so that a cookie jar can validate public suffixes.
# Perun only ever talks to *.apple.com, and `store::cookie_jar` is 200 lines of
# std that read the same curl-format file.
# `tls` is rustls + webpki-roots, so no OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
