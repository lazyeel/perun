# Vendored from crates.io `bzip2-rs` 0.1.2, unmodified except for the
# `in_buf` bound documented in src/decoder/mod.rs. The upstream benches and
# integration tests are dropped: they need `criterion` and the C `bzip2`
# crate, and nothing in this workspace runs them.
[package]
edition = "2018"
name = "bzip2-rs"
version = "0.1.2"
authors = ["Paolo Barbolini <paolo@paolo565.org>"]
description = "Pure Rust bzip2 decompressor"
license = "MIT/Apache-2.0"
repository = "https://github.com/paolobarbolini/bzip2-rs"

[dependencies]
crc32fast = "1.2.1"
tinyvec = "1.1"

[features]
default = []
