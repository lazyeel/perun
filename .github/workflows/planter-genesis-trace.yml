name: Planter genesis GDB trace

on:
  push:
    branches:
      - rnd/phase1-standalone-anisette
    paths:
      - .github/workflows/planter-genesis-trace.yml
      - crates/perun-cli/examples/adi-android/run-native.sh
      - crates/perun-cli/examples/adi-android/adi_test.c
      - tools/planter_trace_gdb.py
      - tools/analyze_planter_trace.py
      - tools/test_planter_trace.py

permissions:
  contents: write

concurrency:
  group: planter-genesis-trace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate trace tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/planter_trace_gdb.py tools/analyze_planter_trace.py
          python3 -m unittest tools/test_planter_trace.py -v

      - name: Install GDB and filesystem tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gdb e2fsprogs ca-certificates curl unzip python3 file

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER" >&2
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print >&2 || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --version
          # Feed a finite buffer of affirmative answers. Avoid a live `yes` pipe:
          # sdkmanager exits immediately after the last accepted license, which
          # otherwise sends SIGPIPE to yes (and interacts badly with pipefail).
          LICENSE_ANSWERS="$(printf 'y\\n%.0s' {1..100})"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null <<< "$LICENSE_ANSWERS"

      - name: Install or locate Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_ROOT="$SDK_ROOT/ndk/27.2.12479018"
          if [ ! -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang" ]; then
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;27.2.12479018"
          fi
          test -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          echo "ANDROID_NDK=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_CC=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang" >> "$GITHUB_ENV"
          "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang" --version | head -1

      - name: Download Android 21 x86_64 Bionic system image
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/android-x86_64-21_r05.zip"
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
            -o "$ZIP" \
            https://dl.google.com/android/repository/sys-img/android/x86_64-21_r05.zip
          unzip -l "$ZIP" | grep -E 'x86_64/system.img$'
          unzip -p "$ZIP" x86_64/system.img > "$RUNNER_TEMP/android-21-x86_64-system.img"
          test -s "$RUNNER_TEMP/android-21-x86_64-system.img"
          echo "SYS_IMG=$RUNNER_TEMP/android-21-x86_64-system.img" >> "$GITHUB_ENV"
          sha256sum "$RUNNER_TEMP/android-21-x86_64-system.img"

      - name: Install verified Apple TLS trust anchors
        shell: bash
        run: |
          set -euo pipefail
          TRUST_DIR="$RUNNER_TEMP/perun-adi-gdb"
          mkdir -p "$TRUST_DIR"
          ROOT_CA="$TRUST_DIR/AppleIncRootCertificate.cer"
          ROOT_G3="$TRUST_DIR/AppleRootCA-G3.cer"

          # Fetch only official Apple root certificates over the runner's
          # already trusted HTTPS connection, then pin their SHA-256 digests.
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
            -o "$ROOT_CA" \
            https://www.apple.com/appleca/AppleIncRootCertificate.cer
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
            -o "$ROOT_G3" \
            https://www.apple.com/certificateauthority/AppleRootCA-G3.cer

          root_ca_sha="$(openssl x509 -inform DER -in "$ROOT_CA" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          root_g3_sha="$(openssl x509 -inform DER -in "$ROOT_G3" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$root_ca_sha" = "b0b1730ecbc7ff4505142c49f1295e6eda6bcaed7e2c68c5be91b5a11001f024"
          test "$root_g3_sha" = "63343abfb89a6a03ebb57e9b3f5fa7be7c4f5c756f3017b3a8c488c3653e9179"

          # Preserve the normal public CA store and add the two verified
          # Apple trust anchors. Peer/hostname verification remains enabled.
          {
            openssl x509 -inform DER -in "$ROOT_CA" -outform PEM
            openssl x509 -inform DER -in "$ROOT_G3" -outform PEM
            cat /etc/ssl/certs/ca-certificates.crt
          } > "$TRUST_DIR/apple_chain.pem"
          test -s "$TRUST_DIR/apple_chain.pem"
          echo "APPLE_CA_BUNDLE=$TRUST_DIR/apple_chain.pem" >> "$GITHUB_ENV"
          echo "Verified Apple Root CA and Apple Root CA - G3 fingerprints."

      - name: Fetch Apple's x86_64 libraries and run the GDB trace
        id: trace
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/perun-adi-gdb"
          mkdir -p "$WORK"
          cd "$WORK"

          GSA_IP="$(getent ahostsv4 gsa.apple.com | awk 'NR==1 {print $1}')"
          BUY_IP="$(getent ahostsv4 buy.itunes.apple.com | awk 'NR==1 {print $1}')"
          test -n "$GSA_IP"
          test -n "$BUY_IP"

          export SYS_IMG
          export SYSROOT="$WORK/sysroot"
          export LIBS="$WORK/libs"
          export CC="$ANDROID_CC"
          export CA_BUNDLE="${APPLE_CA_BUNDLE:?verified Apple CA bundle missing}"
          export ADI_RESOLVE="gsa.apple.com:443:$GSA_IP,buy.itunes.apple.com:443:$BUY_IP"
          export ANDROID_ROOT=/system ANDROID_DATA=/data
          export PERUN_TRACE_DIR="$WORK/traces"
          export ADI_FORCE_START=1
          export ADI_TRACE_START_ONLY=1
          export GDB_SCRIPT="$GITHUB_WORKSPACE/tools/planter_trace_gdb.py"

          echo "Android NDK compiler: $CC"
          echo "Running non-GDB control first; persisted random identity is reused below."
          export ADI_GDB=0
          set +e
          timeout --signal=TERM 15m bash "$GITHUB_WORKSPACE/crates/perun-cli/examples/adi-android/run-native.sh" \
            > "$WORK/native-console.log" 2>&1
          NATIVE_RC=$?
          set -e
          echo "$NATIVE_RC" > "$WORK/native-exit-code.txt"
          echo "Native control exit code: $NATIVE_RC"

          echo "Using GDB: $(gdb --version | head -1)"
          echo "Running identical harness under GDB with the same working directory/identity."
          export ADI_GDB=1
          set +e
          timeout --signal=TERM 50m bash "$GITHUB_WORKSPACE/crates/perun-cli/examples/adi-android/run-native.sh" \
            > "$WORK/gdb-console.log" 2>&1
          RC=$?
          set -e
          echo "$RC" > "$WORK/run-exit-code.txt"
          echo "RUN_WORK=$WORK" >> "$GITHUB_ENV"
          echo "TRACE_RUN_RC=$RC" >> "$GITHUB_ENV"
          echo "NATIVE_CONTROL_RC=$NATIVE_RC" >> "$GITHUB_ENV"
          echo "Harness/GDB exit code: $RC"
          exit 0

      - name: Build a redacted trace report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          WORK="${RUN_WORK:-$RUNNER_TEMP/perun-adi-gdb}"
          REPORT="$GITHUB_WORKSPACE/research-runs/planter-trace-${GITHUB_RUN_ID}.md"
          mkdir -p "$(dirname "$REPORT")"
          TRACE_ROOT="$WORK/traces" REPORT="$REPORT" RUN_RC="${TRACE_RUN_RC:-not-started}" \
            GDB_VERSION="$(gdb --version | head -1 2>/dev/null || echo unavailable)" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_SHA="$GITHUB_SHA" \
            python3 - <<'PY'
          import csv, json, os, re
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path(os.environ["TRACE_ROOT"])
          report = Path(os.environ["REPORT"])
          run_rc = os.environ.get("RUN_RC", "not-started")
          gdb_version = os.environ.get("GDB_VERSION", "unavailable")
          dirs = sorted((p for p in root.glob("run-*") if p.is_dir()),
                        key=lambda p: p.stat().st_mtime) if root.exists() else []
          run = dirs[-1] if dirs else None
          lines = [
              "# Android CoreADI planter-genesis trace",
              "",
              f"- GitHub run: `{os.environ.get('GITHUB_RUN_ID', 'unknown')}`",
              f"- Source revision: `{os.environ.get('GITHUB_SHA', 'unknown')}`",
              f"- GDB: `{gdb_version}`",
              f"- Harness/GDB exit code: `{run_rc}`",
              f"- Trace directory created: `{'yes' if run else 'no'}`",
              "",
              "This report is intentionally redacted: no SPIM/CPIM, device identifier, raw memory bytes, pointer values, or register snapshots are published.",
              "",
          ]
          if run is None:
              lines += ["## Result", "", "No trace directory was created. Inspect the safe runner diagnostics below.", ""]
              console_log = Path(os.environ.get("RUN_WORK", "")) / "gdb-console.log"
              safe_diagnostics = []
              if console_log.is_file():
                  for raw in console_log.read_text(errors="replace").splitlines():
                      line = raw.strip()
                      if not line:
                          continue
                      low = line.lower()
                      stage = line.startswith(("== ", "PT_INTERP ->", "   PT_INTERP ->"))
                      failure = any(marker in low for marker in (
                          "ld.lld:", "clang: error:", "error while loading shared libraries",
                          "no such file or directory", "permission denied", "exec format error",
                          "cannot execute", "during startup program exited with code",
                          "program exited with code", "not an executable", "invalid elf",
                          "cannot find", "undefined reference", "failed to execute",
                          "failed to start", "could not open", "warning: error disabling address space randomization",
                      ))
                      if stage or failure:
                          # Do not publish process addresses, UUIDs, or arbitrary app output.
                          line = re.sub(r"0x[0-9a-fA-F]{8,}", "[address]", line)
                          line = re.sub(
                              r"(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b",
                              "[uuid]", line)
                          safe_diagnostics.append(line[:400])
              lines += ["## Safe runner diagnostics", ""]
              if safe_diagnostics:
                  lines += [f"- `{item}`" for item in safe_diagnostics[-40:]]
              else:
                  lines.append("No allow-listed launcher/build diagnostics were found in the private console log.")
              lines.append("")
          else:
              manifest = {}
              try:
                  manifest = json.loads((run / "run.json").read_text())
              except Exception:
                  pass
              lines += [f"- Trace run id: `{manifest.get('run_id', run.name)}`",
                        f"- Tracer version: `{manifest.get('script_version', 'unknown')}`", ""]
              log = (run / "trace.log").read_text(errors="replace") if (run / "trace.log").exists() else ""
              trace_lines = log.splitlines()

              # Publish only booleans and aggregate counts from the v18
              # pre-transform snapshot; never expose pointers or memory bytes.
              early_anchor = []
              window_deltas = defaultdict(list)
              for trace_line in trace_lines:
                  anchor_match = re.search(
                      r"EARLY PLANTER SOURCE-ANCHOR: mapped=(True|False) "
                      r"slot_eq_source_plus_0x20=(True|False)", trace_line)
                  if anchor_match:
                      early_anchor.append((anchor_match.group(1) == "True",
                                           anchor_match.group(2) == "True"))
                  delta_match = re.search(
                      r"PLANTER DELTA ([A-Za-z0-9_]+): changed=(\d+)/256 "
                      r"pre_unique=(\d+)/256 now_unique=(\d+)/256 "
                      r"now_permutation=(True|False)", trace_line)
                  if delta_match:
                      window_deltas[delta_match.group(1)].append({
                          "changed": int(delta_match.group(2)),
                          "pre_unique": int(delta_match.group(3)),
                          "now_unique": int(delta_match.group(4)),
                          "permutation": delta_match.group(5) == "True",
                      })
              lines += ["## Early planter anchor", ""]
              if early_anchor:
                  mapped, slot_match = early_anchor[-1]
                  lines.append("- Source+0x20 span mapped before transform: " +
                               ("yes" if mapped else "no"))
                  lines.append("- [rbp-0x30] equaled source+0x20 at source-slot store: " +
                               ("yes" if slot_match else "no"))
              else:
                  lines.append("No early source+0x20 snapshot was recorded.")
              lines += ["", "## Window evolution (pre-transform → mixer read)", ""]
              if window_deltas:
                  lines += ["| Window | Mixer samples | First changed | Final changed | Final unique | Final permutation |",
                            "|---|---:|---:|---:|---:|---:|"]
                  for name, samples in sorted(window_deltas.items()):
                      first, last = samples[0], samples[-1]
                      lines.append(
                          f"| {name} | {len(samples)} | {first['changed']}/256 | "
                          f"{last['changed']}/256 | {last['now_unique']}/256 | "
                          f"{'yes' if last['permutation'] else 'no'} |")
              else:
                  lines.append("No source-anchored window comparisons were recorded.")
              lines.append("")

              install_stages = [
                  ("global writer probes requested", "ENTRY COMMAND: installing global writer probes"),
                  ("global installer entered", "GLOBAL INSTALL STAGE: command list entered"),
                  ("source-slot breakpoint created", "GLOBAL INSTALL STAGE: source-slot breakpoint created"),
                  ("post-malloc breakpoint created", "GLOBAL INSTALL STAGE: post-malloc breakpoint created"),
                  ("copy-entry breakpoint created", "GLOBAL INSTALL STAGE: copy-entry breakpoint created"),
                  ("writer breakpoints created", "GLOBAL INSTALL STAGE: writer breakpoint"),
                  ("target transform probes requested", "ENTRY COMMAND: installing target transform probes"),
                  ("target installer entered", "TRANSFORM INSTALL STAGE: command list entered"),
                  ("target mixer-read breakpoint created", "TRANSFORM INSTALL STAGE: mixer-read breakpoint"),
              ]
              lines += ["## GDB installation steps", "",
                        "| Stage | Reached |", "|---|---:|"]
              lines += [f"| {label} | {'yes' if marker in log else 'no'} |"
                        for label, marker in install_stages]
              for label, fragment in [
                  ("global writer breakpoints", "GLOBAL INSTALL STAGE: writer breakpoint"),
                  ("base-load breakpoints", "TRANSFORM INSTALL STAGE: base-load breakpoint"),
                  ("mixer-read breakpoints", "TRANSFORM INSTALL STAGE: mixer-read breakpoint"),
              ]:
                  count = sum(fragment in x for x in trace_lines)
                  lines.append(f"- {label} created: {count}")
              lines.append("")
              checkpoints = [
                  ("Tracer initialized", "armed; output=" in log),
                  ("First vdfut768ig entry", "FIRST vdfut768ig entry" in log),
                  ("Global writer probes installed", "GLOBAL INSTALL STAGE: writer breakpoint" in log),
                  ("Target mixer probes installed", "TRANSFORM INSTALL STAGE: mixer-read breakpoint" in log),
                  ("Subsequent vdfut768ig entry logged", "vdfut768ig entry: opcode=" in log),
                  ("Transform opcode observed", "transform=True" in log),
                  ("Source pointer captured", "SOURCE SLOT STORE" in log),
                  ("malloc result captured", "POST_MALLOC" in log),
                  ("Planter base candidate observed",
                   any(marker in log for marker in (
                       "PLANTER WRITER CANDIDATE", "PLANTER BASE IDENTIFIED", "PLANTER SCAN SELECTED"))),
                  ("Source/planter overlap measured",
                   "SOURCE/PLANTER OVERLAP" in log or "PLANTER SCAN SELECTED" in log),
                  ("First mixer read reached", "FIRST MIXER READ" in log),
                  ("Signal location captured", "SIGNAL STOP:" in log),
              ]
              lines += ["## Tracer progress", "", "| Checkpoint | Reached |",
                        "|---|---:|"]
              lines += [f"| {name} | {'yes' if ok else 'no'} |"
                        for name, ok in checkpoints]
              error_counts = {
                  "Breakpoint installation errors": sum("INSTALL ERROR:" in x for x in trace_lines),
                  "Watchpoint setup errors": sum("WATCH ERROR" in x for x in trace_lines),
                  "Watchpoint callback errors": sum("WATCH CALLBACK ERROR" in x for x in trace_lines),
              }
              lines += ["", "## Tracer errors", ""]
              lines += [f"- {name}: {count}" for name, count in error_counts.items()]

              lines += ["", "## Crash-site backtrace", ""]
              signal_lines = [x for x in trace_lines if "SIGNAL STOP:" in x]
              signal_match = (re.search(
                  r"name=(SIG[A-Z0-9]+)\s+pc_rva=(0x[0-9a-fA-F]+|outside-module)\s+active_opcode=(0x[0-9a-fA-F]+|unknown)",
                  signal_lines[-1]) if signal_lines else None)
              if signal_match:
                  lines.append(f"- Signal: {signal_match.group(1)}")
                  lines.append(f"- CoreADI location: {signal_match.group(2)}")
                  lines.append(f"- Active opcode: {signal_match.group(3)}")
                  frames = []
                  for trace_line in trace_lines:
                      frame_match = re.search(
                          r"SIGNAL FRAME: n=(\d+) (rva=0x[0-9a-fA-F]+|external) symbol=(.*)$",
                          trace_line)
                      if frame_match:
                          frames.append(
                              f"#{frame_match.group(1)} {frame_match.group(2)} {frame_match.group(3)}")
                  lines.append("- Backtrace: " + (" -> ".join(frames[:12]) if frames else "no symbolic frames"))
              else:
                  lines.append("No signal-stop location was recorded.")
              console_log = Path(os.environ.get("RUN_WORK", "")) / "gdb-console.log"
              console_diagnostics = []
              login_codes = []
              start_results = []
              http_responses = []
              provisioning_fatals = []
              spim_lengths = []
              if console_log.is_file():
                  for raw in console_log.read_text(errors="replace").splitlines():
                      line = raw.strip()
                      low = line.lower()
                      login_match = re.search(r"ADIGetLoginCode=(-?\d+)", line)
                      if login_match:
                          login_codes.append(int(login_match.group(1)))
                      start_match = re.search(
                          r"TRACE-ONLY start rc=(-?\d+) cpim_len=(\d+)", line)
                      if start_match:
                          start_results.append((int(start_match.group(1)), int(start_match.group(2))))
                      response_match = re.search(r"\[net\]\s+->\s+(\d+)\s+\((\d+)\s+bytes\)", line)
                      if response_match:
                          http_responses.append((int(response_match.group(1)), int(response_match.group(2))))
                      spim_match = re.search(r"spim received \((\d+) bytes decoded\)", line, re.I)
                      if spim_match:
                          spim_lengths.append(int(spim_match.group(1)))
                      if "[fatal]" in low:
                          status_match = re.search(r"HTTP\s+(\d{3})", line, re.I)
                          if status_match:
                              provisioning_fatals.append("Apple endpoint HTTP " + status_match.group(1))
                          elif "failed:" in low:
                              detail = low.split("failed:", 1)[1].strip()
                              if "resolve host" in detail or "resolve proxy" in detail:
                                  category = "DNS resolution failure"
                              elif "ssl" in detail or "certificate" in detail or "peer verification" in detail:
                                  category = "TLS handshake/certificate failure"
                              elif "network is unreachable" in detail:
                                  category = "network unreachable"
                              elif "timed out" in detail or "timeout" in detail:
                                  category = "TCP/request timeout"
                              elif "connect" in detail or "connection" in detail:
                                  category = "TCP connection failure"
                              elif "recv failure" in detail or "send failure" in detail:
                                  category = "socket I/O failure"
                              else:
                                  category = "other curl transport failure"
                              provisioning_fatals.append("Apple endpoint " + category)
                          elif "url bag did not contain" in low:
                              provisioning_fatals.append("lookup response lacked provisioning endpoints")
                          elif "no spim in" in low:
                              provisioning_fatals.append("start response lacked SPIM field")
                          elif "no ptm/tk" in low:
                              provisioning_fatals.append("finish response lacked ptm/tk fields")
                          else:
                              provisioning_fatals.append("harness fatal exit (details withheld)")
                      if "program received signal" in low:
                          tail = low.split("program received signal", 1)[1].strip()
                          signal = tail.split(",", 1)[0].split()[0] if tail else "unknown"
                          console_diagnostics.append(f"GDB inferior signal: {signal.upper()}")
                      elif "during startup program exited with code" in low:
                          console_diagnostics.append("GDB reports inferior exited during startup")
                      elif "internal-error:" in low:
                          console_diagnostics.append("GDB internal error reported")
                      elif "python exception" in low or "error occurred in python" in low:
                          console_diagnostics.append("GDB Python exception reported")
                      elif "segmentation fault" in low:
                          console_diagnostics.append("Segmentation fault reported by launcher/child")
              native_log = Path(os.environ.get("RUN_WORK", "")) / "native-console.log"
              native_rc_file = Path(os.environ.get("RUN_WORK", "")) / "native-exit-code.txt"
              native_rc = native_rc_file.read_text().strip() if native_rc_file.is_file() else "not-run"
              native_start_results = []
              native_spim_lengths = []
              native_fatals = []
              if native_log.is_file():
                  for raw in native_log.read_text(errors="replace").splitlines():
                      start_match = re.search(r"TRACE-ONLY start rc=(-?\d+) cpim_len=(\d+)", raw)
                      if start_match:
                          native_start_results.append((int(start_match.group(1)), int(start_match.group(2))))
                      spim_match = re.search(r"spim received \((\d+) bytes decoded\)", raw, re.I)
                      if spim_match:
                          native_spim_lengths.append(int(spim_match.group(1)))
                      signal_match = re.search(r"\[FATAL\] signal (\d+)", raw, re.I)
                      if signal_match:
                          native_fatals.append(int(signal_match.group(1)))
              lines += ["", "## Native non-GDB control", ""]
              lines.append(f"- Exit code: {native_rc}")
              lines.append("- SPIM decoded lengths: " +
                           (", ".join(str(n) + " bytes" for n in native_spim_lengths)
                            if native_spim_lengths else "not observed"))
              lines.append("- ProvisioningStart results: " +
                           (", ".join(f"rc={rc}, cpim_len={n}" for rc, n in native_start_results)
                            if native_start_results else "not observed"))
              lines.append("- C harness signal handler: " +
                           (", ".join("signal " + str(n) for n in native_fatals)
                            if native_fatals else "not observed"))
              lines += ["", "## Apple network/provisioning progression", ""]
              lines.append("- HTTP responses: " +
                           (" -> ".join(f"{code} ({size} bytes)" for code, size in http_responses)
                            if http_responses else "not observed"))
              lines.append("- SPIM decoded lengths: " +
                           (", ".join(str(n) + " bytes" for n in spim_lengths)
                            if spim_lengths else "not observed"))
              lines.append("- Provisioning fatal classifications: " +
                           ("; ".join(dict.fromkeys(provisioning_fatals))
                            if provisioning_fatals else "none observed"))
              lines += ["", "## Harness branch results", ""]
              lines.append("- ADIGetLoginCode results: " +
                           (", ".join(str(x) for x in login_codes) if login_codes else "not observed"))
              if start_results:
                  for rc, cpim_len in start_results:
                      lines.append(f"- Trace-only ProvisioningStart: rc={rc}, cpim_len={cpim_len}")
              else:
                  lines.append("- Trace-only ProvisioningStart result: not observed")
              provisioning_start_entered = False
              spim_decoded = False
              if console_log.is_file():
                  private_console = console_log.read_text(errors="replace")
                  provisioning_start_entered = "entering ProvisioningStart path:" in private_console
                  spim_decoded = "spim received (" in private_console
              lines += ["", "## Live provisioning path", ""]
              lines.append(f"- ProvisioningStart path entered: {'yes' if provisioning_start_entered else 'no/not observed'}")
              lines.append(f"- SPIM decoded from live Apple response: {'yes' if spim_decoded else 'no/not observed'}")
              lines += ["## vdfut768ig opcode sequence", ""]
              observed_opcodes = []
              entry_commands = []
              for trace_line in trace_lines:
                  # log() prepends a timestamp; match markers anywhere in the line.
                  if ("FIRST vdfut768ig entry:" in trace_line or
                          "vdfut768ig entry:" in trace_line):
                      opcode_match = re.search(r"opcode=(0x[0-9a-fA-F]+)", trace_line)
                      if opcode_match:
                          observed_opcodes.append(opcode_match.group(1))
                  if "ENTRY COMMAND:" in trace_line:
                      if "installing global writer probes" in trace_line:
                          entry_commands.append("global-writers")
                      elif "installing target transform probes" in trace_line:
                          entry_commands.append("target-mixers")
                      else:
                          command_match = re.search(r"skipped opcode=(0x[0-9a-fA-F]+)", trace_line)
                          entry_commands.append(
                              "skip " + command_match.group(1) if command_match else "other")
              if observed_opcodes:
                  lines.append("- " + " -> ".join(observed_opcodes[:32]))
              else:
                  lines.append("No vdfut768ig opcode values were recorded.")
              lines.append("- Entry breakpoint command-list actions: " +
                           (", ".join(entry_commands[:32]) if entry_commands else "not observed"))
              lines += ["", "## GDB console status", ""]
              lines += [f"- {item}" for item in sorted(set(console_diagnostics))]
              if not console_diagnostics:
                  lines.append("No allow-listed GDB console diagnostic matched.")
              lines.append("")
              planter_path = run / "planter.final.bin"
              candidate_files = sorted(
                  list(run.glob("mixer_*_candidate_*.bin")) + list(run.glob("planter.at_*.bin")),
                  key=lambda p: p.stat().st_mtime)
              window_files = sorted(run.glob("window_*.final_candidate.bin"))
              snapshot_path = (planter_path if planter_path.exists() else
                               (candidate_files[-1] if candidate_files else None))
              planter = snapshot_path.read_bytes() if snapshot_path else b""
              snapshot_kind = ("final" if snapshot_path == planter_path else
                               (f"candidate:{snapshot_path.name}" if snapshot_path else "none"))
              tables = {"fam1":0x0D60,"fam2":0x1A00,"fam3":0x2460,"fam4":0x1390}
              scan_selected = next((x for x in trace_lines if "PLANTER SCAN SELECTED:" in x), None)
              scan_miss = next((x for x in trace_lines if "PLANTER SCAN: no four-permutation candidate" in x), None)
              lines += ["## Full-memory signature scan", ""]
              if scan_selected:
                  scan_match = re.search(
                      r"source_relative_base=(\S+) source_overlap=(\d+/224 mismatches|unknown) pointer_at_rbp_minus_0x30=(True|False) matches=(\d+)",
                      scan_selected)
                  if scan_match:
                      lines.append("- Four-permutation candidate: yes")
                      lines.append(f"- Candidate relative to source: {scan_match.group(1)}")
                      lines.append(f"- Source/planter overlap: {scan_match.group(2)}")
                      lines.append(f"- Pointer held at [rbp-0x30]: {scan_match.group(3)}")
                      lines.append(f"- Signature candidates found: {scan_match.group(4)}")
                  else:
                      lines.append("- Candidate selected; summary parser did not match the diagnostic line.")
              elif scan_miss:
                  scan_counts = re.search(r"regions=(\d+) bytes=(\d+)", scan_miss)
                  lines.append("- Four-permutation candidate: no")
                  if scan_counts:
                      lines.append(f"- RW regions scanned: {scan_counts.group(1)}")
                      lines.append(f"- Bytes inspected: {scan_counts.group(2)}")
              else:
                  lines.append("The memory signature scan did not run or did not record a result.")
              lines += ["", "## Capture checkpoints", "",
                        f"- Software watchpoints armed: `{'yes' if 'WATCH ARMED' in log else 'no'}`",
                        f"- Planter base candidate logged: `{'yes' if 'PLANTER BASE CANDIDATE' in log or 'PLANTER BASE IDENTIFIED' in log or 'PLANTER SCAN SELECTED' in log else 'no'}`",
                        f"- Mapped 0x2700 candidate snapshots: `{len(candidate_files)}`",
                        f"- Independent writer-window snapshots: `{len(window_files)}`",
                        f"- Final four-permutation snapshot: `{'yes' if planter_path.exists() else 'no'}`",
                        f"- Source/planter overlap check executed: `{'yes' if 'source[32:256] == planter[0:224]' in log or 'SOURCE/PLANTER OVERLAP' in log or 'PLANTER SCAN SELECTED' in log else 'no'}`",
                        f"- Snapshot selected for byte statistics: `{snapshot_kind}`", ""]
              if candidate_files:
                  lines += ["## Mapped candidate object snapshots", "",
                            "| Snapshot | Bytes | fam1 unique | fam2 unique | fam3 unique | fam4 unique |",
                            "|---|---:|---:|---:|---:|---:|"]
                  for candidate_path in candidate_files:
                      data = candidate_path.read_bytes()
                      vals = []
                      for _name, _off in tables.items():
                          w = data[_off:_off+256] if len(data) >= _off+256 else b""
                          vals.append(f"{len(set(w))}/256" if w else "n/a")
                      lines.append(f"| {candidate_path.name} | {len(data)} | " + " | ".join(vals) + " |")
              if window_files:
                  lines += ["", "## Independent writer-window snapshots", "",
                            "| Window | Unique bytes | Permutation |", "|---|---:|---:|"]
                  for window_path in window_files:
                      data = window_path.read_bytes()
                      lines.append(f"| {window_path.stem} | {len(set(data))}/256 | {'yes' if len(data)==256 and len(set(data))==256 else 'no'} |")
              for name, off in tables.items():
                  data = planter[off:off+256] if len(planter) >= off+256 else b""
                  unique = len(set(data))
                  cycles = Counter()
                  if len(data) == 256 and unique == 256:
                      seen = set()
                      for start in range(256):
                          if start in seen: continue
                          cur, n = start, 0
                          while cur not in seen:
                              seen.add(cur); n += 1; cur = data[cur]
                          cycles[n] += 1
                  lines.append(f"| {name} | {unique}/256 | {'yes' if len(data)==256 and unique==256 else 'no'} | {data.count(0) if data else 'n/a'} | {sum(cycles.values()) if cycles else 'n/a'} |")
              lines += ["", "## Unknown regions", "", "| Region | Size | Unique byte values |",
                        "|---|---:|---:|"]
              for item in manifest.get("unknown_ranges", []):
                  try:
                      name, off, size = item
                      off, size = int(off), int(size)
                      data = planter[off:off+size] if len(planter) >= off+size else b""
                      lines.append(f"| {name} | {size:#x} | {len(set(data)) if data else 'n/a'} |")
                  except Exception:
                      continue
              lines += ["", "## Direct writer coverage by opcode", "",
                        "| Writer | vdfut opcode | Hits | Distinct indices | Index min..max | Base−source delta |",
                        "|---|---|---:|---:|---:|---:|"]
              groups = defaultdict(list)
              csv_path = run / "writer_events.csv"
              if csv_path.exists():
                  with csv_path.open(newline="") as stream:
                      for row in csv.DictReader(stream):
                          groups[(row.get("name", "unknown"),
                                   row.get("active_opcode", "unknown"))].append(row)
              for (name, opcode), rows in sorted(groups.items()):
                  try:
                      indexes = [int(row["index"],16) for row in rows]
                      span = f"{min(indexes):#x}..{max(indexes):#x}" if indexes else "n/a"
                      deltas = []
                      for row in rows:
                          raw_delta = row.get("source_delta", "na")
                          if raw_delta and raw_delta != "na":
                              try: deltas.append(int(raw_delta, 16))
                              except ValueError: pass
                      delta_span = (f"{min(deltas):+#x}..{max(deltas):+#x}"
                                    if deltas else "n/a")
                      lines.append(f"| {name} | {opcode} | {len(rows)} | {len(set(indexes))} | {span} | {delta_span} |")
                  except Exception:
                      lines.append(f"| {name} | {opcode} | {len(rows)} | n/a | n/a | n/a |")
              lines += ["", "## Status", ""]
              if planter_path.exists() and len(planter) >= 0x2700:
                  lines.append("A final 0x2700-byte planter snapshot passed the four-permutation signature check.")
              elif candidate_files:
                  lines.append(f"Captured {len(candidate_files)} mapped 0x2700-byte candidate snapshots, but no final four-permutation planter signature was validated.")
              elif run_rc == "0":
                  lines.append("The harness exited successfully, but no mapped planter candidate or final snapshot was recorded.")
              else:
                  lines.append("The run did not produce a validated planter snapshot. Raw traces remain on the ephemeral runner and are not published.")
              lines.append("")
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text("\n".join(lines), encoding="utf-8")
          print(report.read_text())
          PY
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the redacted report to the research branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-runs/planter-trace-${GITHUB_RUN_ID}.md
          if git diff --cached --quiet; then
            echo "No report to commit."
            exit 0
          fi
          git commit -m "research(adi): record planter trace run ${GITHUB_RUN_ID}"
          # A source commit may land while the trace is running. Rebase the
          # per-run report commit onto the current branch before publishing it.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Branch advanced during push (attempt $attempt); retrying."
          done
          echo "Could not publish the trace report after three attempts." >&2
          exit 1
