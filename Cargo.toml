[workspace]
resolver = "2"
members = [
    "crates/perun-core",
    "crates/perun-shims",
    "crates/perun-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/lazyeel/perun"

[workspace.dependencies]
perun-core = { path = "crates/perun-core" }
perun-shims = { path = "crates/perun-shims" }

[profile.release]
debug = false
strip = true
lto = "thin"
# The release profile is stripped and carries no debug info. Panic Location
# strings of registry crates still name the build host's cargo home; for
# distributed binaries scrub them per invocation (works on any machine):
#   RUSTFLAGS="--remap-path-prefix=$HOME=." cargo build --release
# Local crash forensics instead wants symbols:
#   CARGO_PROFILE_RELEASE_DEBUG=2 cargo build --release

# Native-parity stack geometry for the shims: the obfuscated guest folds
# "uninitialized" stack slots of shim frames into its pointer arithmetic,
# so the shim frames must match the O2-compiled reference interposer's
# shape (push rbp + call, 0x10 total). Debug Rust adds ~0x80 of locals;
# O2 collapses the once-shim to the same 16-byte frame as O2 C.
[profile.dev.package.perun-shims]
opt-level = 2
