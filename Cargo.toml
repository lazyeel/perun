[workspace]
resolver = "2"
members = [
    "crates/perun-core",
    "crates/perun-shims",
    "crates/perun-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lazyeel/perun"

[workspace.dependencies]
perun-core = { path = "crates/perun-core" }
perun-shims = { path = "crates/perun-shims" }

[profile.release]
debug = false
# `panic = "abort"` is safe here: nothing in the workspace uses `catch_unwind`
# or a panic hook, so no path relies on unwinding. A guest panic aborts instead
# of killing a thread, and the panic message is still printed first.
panic = "abort"
strip = true
# Full LTO in one codegen unit: the shim table is a `distributed_slice` whose
# entries live in every target, so cross-crate inlining is what lets the SAP
# dispatch collapse. Costs build time, buys a smaller and tighter binary.
opt-level = 3
lto = "fat"
codegen-units = 1
# The release profile is stripped and carries no debug info. Panic Location
# strings of registry crates still name the build host's cargo home; for
# distributed binaries scrub them per invocation (works on any machine):
#   RUSTFLAGS="--remap-path-prefix=$HOME=." cargo build --release
# Local crash forensics instead wants symbols:
#   CARGO_PROFILE_RELEASE_DEBUG=2 cargo build --release
# Note: `cargo test` uses the test profile, so `panic = "abort"` does not reach
# the test harness.

# Native-parity stack geometry for the shims: the obfuscated guest folds
# "uninitialized" stack slots of shim frames into its pointer arithmetic,
# so the shim frames must match the O2-compiled reference interposer's
# shape (push rbp + call, 0x10 total). Debug Rust adds ~0x80 of locals;
# O2 collapses the once-shim to the same 16-byte frame as O2 C.
[profile.dev.package.perun-shims]
opt-level = 2

# `bzip2-rs` 0.1.2 is vendored under `vendor/` with a bounded staging buffer.
# Upstream never drained its input buffer — the one `drain` sat in a branch that
# cannot be reached — so decompressing the asset payload grew RSS in step with
# the compressed bytes consumed, +22 MiB after 32 MiB on the SAP cold path. The
# patch is in `src/decoder/mod.rs` and is marked `VENDORED PATCH` throughout.
# The alternative was `libbz2`, measured at 65.6 MB/s against this crate's
# 109.2 MB/s on the same data, i.e. the fix would have cost ~1.5 s of wall.
[patch.crates-io]
bzip2-rs = { path = "vendor/bzip2-rs" }
